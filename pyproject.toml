[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "demographics-lab"
version = "0.2.0"
description = "A reproducible population simulation lab with a Streamlit dashboard and optional native engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["streamlit>=1.45,<2", "pandas>=2.2,<3", "altair>=5.5,<6"]

[project.scripts]
demographics = "demographics.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "setuptools>=75",
    "types-setuptools>=75",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "pandas-stubs>=2.2,<3",
]

[tool.setuptools.packages.find]
include = ["demographics*"]

[tool.mypy]
strict = true
files = ["demographics", "app.py", "setup_native.py", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
